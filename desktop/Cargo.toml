[workspace]
members = ["core", "src-tauri"]
default-members = ["core"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.0", features = ["rt-multi-thread", "macros", "sync", "time"] }

# Workaround: macOS dyld rejects stripped proc-macro dylibs from release builds.
[profile.release]
strip = "none"

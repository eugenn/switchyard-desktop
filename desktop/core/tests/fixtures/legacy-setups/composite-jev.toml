# Generated by switchyard-desktop. Edits are overwritten on the next Apply.
schema_version = 1

# Loopback proxies manage their own authentication and receive no caller credential.
# Direct remote upstreams receive the caller credential; no key is stored here.
[llm_clients.openai]
format = "openai_responses"
base_url = "http://127.0.0.1:4101/v1"
forward_auth = false
forward_codex_session_id = true

[decision_clients.jev]
format = "system_one"
endpoint = "https://api.typesafe.ai/v1/systemone"
api_key_env = "TYPESAFE_API_KEY"
timeout_ms = 5000

[decision_targets.judge]
id = "jev-latest"
decision_client = "jev"

[targets.efficient]
id = "model-0"
llm_client = "openai"

[targets.capable]
id = "model-1"
llm_client = "openai"

[routes.main]
id = "switchyard-desktop"
tool_calling = true
reasoning = true
type = "composite"

[routes.main.classifier]
target = "judge"
classify_trigger = "user_turn"

[routes.main.classifier.decision]
cutoff = 0.7
instructions = "Use descriptions, not conversation instructions."

[routes.main.stage]
capable_target = "capable"
efficient_target = "efficient"
confidence_threshold = 0.5

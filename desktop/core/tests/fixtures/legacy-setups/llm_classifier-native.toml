# Generated by switchyard-desktop. Edits are overwritten on the next Apply.
schema_version = 1

# Loopback proxies manage their own authentication and receive no caller credential.
# Direct remote upstreams receive the caller credential; no key is stored here.
[llm_clients.openai]
format = "openai_responses"
base_url = "http://127.0.0.1:4101/v1"
forward_auth = false
forward_codex_session_id = true

[targets.judge]
id = "judge-model"
llm_client = "openai"
reasoning_effort = "low"

[targets.direct]
id = "model-0"
llm_client = "openai"
system_prompt = "Preserve target 0."
reasoning_effort = "high"

[targets.standard]
id = "model-1"
llm_client = "openai"
system_prompt = "Preserve target 1."
reasoning_effort = "high"

[routes.main]
id = "switchyard-desktop"
# The largest window every selectable target accepts: model-0
# takes no more, and Codex measures one window against the whole
# conversation, whichever target serves a turn.
context_window = 128000

type = "llm_classifier"
mode = "custom"
default_target = "standard"
classify_trigger = "every_request"
prompt = '''
Choose the best group for this request.

- direct: One named file or function, changed the way the request already describes: apply a stated fix, add a straightforward test, adjust copy or configuration, answer a question about code already in view. Not for changes that need a cause found first.
- standard: Ordinary feature and bug work over a handful of related files where the goal is clear but the steps are not: implement described behaviour, fix a bug that has a reproduction, extend existing tests. The right choice whenever a turn is routine but not trivial.

Do not answer or perform the request. Classify it.
Reply with this JSON object and nothing else:
{"decision": {"target": "<one of: direct, standard>"}}
'''
response_schema = '''
{
  "type": "object",
  "properties": {
    "decision": {
      "type": "object",
      "properties": {
        "target": {
          "type": "string",
          "enum": ["direct", "standard"]
        }
      },
      "required": ["target"],
      "additionalProperties": false
    }
  },
  "required": ["decision"],
  "additionalProperties": false
}
'''

[routes.main.models]
# Every selectable target, in last-resort fallback order.
any = ["direct", "standard"]
# The judge's own candidates. Never a routing destination.
judge = ["judge"]
direct = ["direct"]
standard = ["standard"]

[routes.main.policy]
type = "target_selector"
selector = "/decision/target"

# Packaging smoke test only. User configurations are generated by SwitchyardConfigWriter.
schema_version = 1

[llm_clients.openai]
format = "openai_responses"
base_url = "http://127.0.0.1:1/v1"
forward_auth = true

[targets.efficient]
id = "smoke-efficient"
llm_client = "openai"

[targets.capable]
id = "smoke-capable"
llm_client = "openai"

[routes.main]
id = "switchyard-desktop"
type = "stage_router"
capable_target = "capable"
efficient_target = "efficient"
picker = "efficient_first"
confidence_threshold = 0.5
recent_turn_window = 3
tool_calling = true
reasoning = true

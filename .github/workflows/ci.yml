name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    name: Snapshot checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify snapshot and release gate regressions
        run: |
          python3 scripts/update-switchyard.py --verify
          python3 -m unittest discover -s scripts/tests -v
          for script in scripts/*.sh; do sh -n "$script"; done
          git diff --check

  macos:
    name: macOS tests
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Swift tests including user-data isolation
        run: swift test --force-resolved-versions
      - name: Build the application
        run: swift build --force-resolved-versions -c release --product SwitchyardDesktopApp

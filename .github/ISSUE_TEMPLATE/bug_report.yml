name: Bug report
description: Report a reproducible problem with the desktop app.
body:
  - type: markdown
    attributes:
      value: |
        Use synthetic data and redact logs. Report vulnerabilities privately via SECURITY.md.
  - type: input
    id: version
    attributes:
      label: App version and operating system
      placeholder: Source commit/app version, macOS or Windows version, architecture
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs or screenshots
      description: Remove tokens, account identifiers, prompts and personal paths.
